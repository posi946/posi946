<svg width="320" height="320" viewBox="0 0 320 320" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="Mubaraq Lawal's GitHub avatar inside slowly rotating terminal rings">
  <style>
    .avatar-in { opacity: 0; animation: fadein 0.7s cubic-bezier(0.23, 1, 0.32, 1) 0.1s forwards; }
    .ring-a { transform-origin: 160px 160px; animation: spin 16s linear infinite; }
    .ring-b { transform-origin: 160px 160px; animation: spin 26s linear infinite reverse; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes fadein { to { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) {
      .ring-a, .ring-b { animation: none; }
      .avatar-in { animation: none; opacity: 1; }
    }
  </style>
  <defs>
    <clipPath id="pic"><circle cx="160" cy="160" r="88"/></clipPath>
  </defs>
  <g class="avatar-in">
    <image href="data:image/png;base64," x="72" y="72" width="176" height="176" clip-path="url(#pic)"/>
    <circle cx="160" cy="160" r="88" fill="none" stroke="#00d9ff" stroke-opacity="0.35" stroke-width="1.5"/>
  </g>
  <circle class="ring-a" cx="160" cy="160" r="99" fill="none" stroke="#00d9ff" stroke-width="2" stroke-linecap="round" stroke-dasharray="5 17" opacity="0.9"/>
  <circle class="ring-b" cx="160" cy="160" r="112" fill="none" stroke="#0891b2" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="2 26" opacity="0.55"/>
  <circle cx="160" cy="160" r="124" fill="none" stroke="#00d9ff" stroke-opacity="0.18" stroke-width="1"/>
</svg>
