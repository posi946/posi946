<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mubaraq Lawal's avatar: a blinking terminal cursor inside a slowly marching dashed ring">
  <style>
    /*
      6s master loop — every animation period divides 6s, so this file
      exports to a seamless GIF (and simply runs, forever, as SVG).
      Blink is 1.2s x5; the typing story plays once per 6s; ring march = 10
      dash periods per 6s. All slides land on lit frames of the blink, so
      the cursor is always visible while it moves.
    */
    .ring-march { animation: march 6s linear infinite; }
    .cursor     { animation: blink 1.2s linear infinite, cursor-loop 6s linear infinite; }
    .chev       { opacity: 0; animation: chev-loop 6s linear infinite; }
    .char1      { opacity: 0; transform-box: fill-box; transform-origin: center; animation: char1-loop 6s linear infinite; }
    .char2      { opacity: 0; transform-box: fill-box; transform-origin: center; animation: char2-loop 6s linear infinite; }

    @keyframes march { from { stroke-dashoffset: 0; } to { stroke-dashoffset: -120; } }
    @keyframes blink {
      0%, 44%  { opacity: 1; }
      48%, 96% { opacity: 0; }
      100%     { opacity: 1; }
    }
    @keyframes cursor-loop {
      0%, 20%  { transform: translateX(0);     animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
      25%      { transform: translateX(38px); }
      40%      { transform: translateX(38px);  animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
      45%      { transform: translateX(76px); }
      80%      { transform: translateX(76px);  animation-timing-function: cubic-bezier(0.77, 0, 0.175, 1); }
      88%, 100%{ transform: translateX(0); }
    }
    @keyframes chev-loop {
      0%, 20%  { opacity: 0; animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
      23%      { opacity: 1; animation-timing-function: linear; }
      80%      { opacity: 1; animation-timing-function: cubic-bezier(0.77, 0, 0.175, 1); }
      84%, 100%{ opacity: 0; }
    }
    @keyframes char1-loop {
      0%, 20%  { opacity: 0; transform: scale(0.55); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
      24%      { opacity: 1; transform: scale(1); }
      80%      { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(0.77, 0, 0.175, 1); }
      84%, 100%{ opacity: 0; transform: scale(0.85); }
    }
    @keyframes char2-loop {
      0%, 40%  { opacity: 0; transform: scale(0.55); animation-timing-function: cubic-bezier(0.23, 1, 0.32, 1); }
      44%      { opacity: 1; transform: scale(1); }
      80%      { opacity: 1; transform: scale(1); animation-timing-function: cubic-bezier(0.77, 0, 0.175, 1); }
      84%, 100%{ opacity: 0; transform: scale(0.85); }
    }
    /* rm:start */
    @media (prefers-reduced-motion: reduce) {
      .ring-march, .cursor, .chev, .char1, .char2 { animation: none; }
      .cursor { opacity: 1; transform: none; }
    }
    /* rm:end */
  </style>
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="78%">
      <stop offset="0" stop-color="#18212c"/>
      <stop offset="0.55" stop-color="#101720"/>
      <stop offset="1" stop-color="#0a0e14"/>
    </radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#00d9ff" stop-opacity="0.16"/>
      <stop offset="0.6" stop-color="#00d9ff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#00d9ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="cursorFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8feeff"/>
      <stop offset="0.55" stop-color="#36dbff"/>
      <stop offset="1" stop-color="#00bfe6"/>
    </linearGradient>
  </defs>

  <circle cx="256" cy="256" r="256" fill="url(#bg)"/>
  <circle cx="256" cy="256" r="252" fill="none" stroke="#00d9ff" stroke-opacity="0.12" stroke-width="2"/>
  <circle cx="256" cy="256" r="228" fill="url(#glow)"/>
  <circle class="ring-march" cx="256" cy="256" r="214" fill="none" stroke="#00d9ff" stroke-opacity="0.5" stroke-width="2" stroke-dasharray="3 9" stroke-linecap="round"/>
  <circle cx="256" cy="256" r="178" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="1.5"/>

  <path class="chev" d="M136 226 L164 256 L136 286" fill="none" stroke="#7ee9ff" stroke-opacity="0.9" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
  <rect class="char1" x="208" y="237" width="28" height="38" rx="6" fill="#7ee9ff" fill-opacity="0.55"/>
  <rect class="char2" x="246" y="237" width="28" height="38" rx="6" fill="#7ee9ff" fill-opacity="0.55"/>
  <g class="cursor">
    <rect x="208" y="192" width="96" height="128" rx="13" fill="url(#cursorFill)"/>
  </g>
</svg>
