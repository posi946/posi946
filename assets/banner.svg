<svg width="1200" height="320" viewBox="0 0 1200 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Mubaraq Lawal - software engineering student, Babcock University">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" stroke="#13131B" stroke-width="1" fill="none"/>
    </pattern>
    <pattern id="scan" width="4" height="4" patternUnits="userSpaceOnUse">
      <path d="M0 1H4" stroke="#FFFFFF" stroke-opacity="0.02" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(600 160) scale(430 240)">
      <stop stop-color="#00E5FF" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#00E5FF" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4"/>
    </filter>
  </defs>
  <style>
    @keyframes blink { 0%, 49% { opacity: 1; } 50%, 100% { opacity: 0; } }
    #cursor { animation: blink 1s steps(1) infinite; }
    @media (prefers-reduced-motion: reduce) {
      #cursor { animation: none; opacity: 1; }
    }
  </style>

  <!-- canvas: OLED black, faint grid, scanlines, cyan ambience -->
  <rect width="1200" height="320" fill="#020204"/>
  <rect width="1200" height="320" fill="url(#grid)" opacity="0.6"/>
  <rect width="1200" height="320" fill="url(#scan)"/>
  <rect width="1200" height="320" fill="url(#glow)"/>

  <!-- double bezel: machined shell + glass window -->
  <rect x="56" y="44" width="1088" height="232" rx="24" fill="#07070B" stroke="#13131C" stroke-width="1"/>
  <rect x="64" y="52" width="1072" height="216" rx="16" fill="#0A0A10" stroke="#1D1D28" stroke-width="1"/>

  <!-- titlebar (rounded top only) -->
  <path d="M64 68C64 59.163 71.163 52 80 52H1120C1128.837 52 1136 59.163 1136 68V96H64V68Z" fill="#0D0D14"/>
  <path d="M64.5 96.5H1135.5" stroke="#16161F"/>
  <circle cx="94" cy="74" r="6" fill="#FF5F57"/>
  <circle cx="116" cy="74" r="6" fill="#FEBC2E"/>
  <circle cx="138" cy="74" r="6" fill="#28C840"/>
  <text x="600" y="79" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="14" fill="#6E6E80">mubaraq@github: ~/profile</text>

  <!-- name: chromatic aberration (magenta behind, cyan front) + white core -->
  <g filter="url(#soft)" opacity="0.55" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="66" font-weight="700" letter-spacing="2" text-anchor="middle">
    <text x="603" y="170" fill="#FF2E88">MUBARAQ LAWAL</text>
    <text x="597" y="174" fill="#00E5FF">MUBARAQ LAWAL</text>
  </g>
  <text x="600" y="172" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="66" font-weight="700" letter-spacing="2" text-anchor="middle" fill="#F4F4F8">MUBARAQ LAWAL</text>

  <!-- whoami line -->
  <text x="600" y="216" text-anchor="middle" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="17" fill="#8A8A9E">$ whoami // software engineering student · babcock university</text>

  <!-- status line: live cursor blink (respects reduced motion) -->
  <text x="96" y="256" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="13" fill="#00E5FF" opacity="0.9">$ status: learning</text>
  <rect id="cursor" x="244" y="243" width="8" height="17" fill="#00E5FF"/>
  <text x="1104" y="256" text-anchor="end" font-family="'JetBrains Mono','Fira Code','SF Mono',Consolas,monospace" font-size="13" fill="#55555F">EST. 2025</text>
</svg>
